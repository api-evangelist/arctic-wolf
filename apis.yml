aid: arctic-wolf
name: Arctic Wolf
description: >-
  Arctic Wolf is a security operations company delivering 24x7 AI-driven managed
  detection and response (MDR), managed risk, incident response, and endpoint
  security through its cloud-native Aurora Platform and Concierge Security
  Team. For developers and OEM partners, Arctic Wolf exposes a set of REST and
  standards-based APIs via docs.arcticwolf.com and the Unified Portal: a Ticket
  API for programmatically listing, commenting on, and closing security tickets;
  a User API and Aurora Endpoint Defense API for user and endpoint management;
  and Threat Intelligence feed APIs (TAXII 1.1, TAXII 2.1, and a Blocklist API)
  for consuming indicators into your own security tooling. Authentication uses
  bearer JWT tokens generated from Personal API Keys in the Unified Portal, with
  regional service endpoints (US, EU, AU, CA pods).
