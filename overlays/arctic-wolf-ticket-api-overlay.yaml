overlay: 1.0.0
info:
  title: API Evangelist enhancements for Arctic Wolf Ticket API
  version: 1.0.0
extends: openapi/arctic-wolf-ticket-api-openapi.json
actions:
- target: $.info
  update:
    x-apievangelist-enriched: '2026-07-18'
    x-apievangelist-auth: bearer-jwt (Personal API Key)
    x-apievangelist-pagination: offset (offset/limit, meta.total)
- target: $.info
  update:
    x-apievangelist-artifacts:
      authentication: authentication/arctic-wolf-authentication.yml
      conventions: conventions/arctic-wolf-conventions.yml
      errors: errors/arctic-wolf-problem-types.yml
      data_model: data-model/arctic-wolf-data-model.yml
