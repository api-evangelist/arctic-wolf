notes: >-
  Arctic Wolf APIs (Ticket API, User API, Aurora Endpoint Defense API) authenticate
  with a bearer JWT. Developers generate a Personal API Key in the Unified Portal
  (portal.arcticwolf.com) under Organization Profile > Personal API Keys, then pass
  it as a bearer token. Service endpoints are regional pods (US001/US002/US003,
  EU001, AU001, CA001); select the pod that matches your organization. The Aurora
  Endpoint Defense API additionally documents a short-lived access-token lifecycle
  (tokens are single-use per request and valid for a few minutes).
